[globals]
OPENCALLER_RING_SECONDS=20

[opencaller-internal]
; Asterisk accepts only these two extension destinations from the test accounts.
exten => 1001,1,NoOp(OpenCaller lab call to test line 1001)
 ; Do not pass a bare endpoint to Dial when it has no registered AoR contact:
 ; Asterisk may fail channel creation before the voicemail fallback is reached.
 same => n,Set(OPENCALLER_1001_CONTACTS=${PJSIP_DIAL_CONTACTS(1001)})
 same => n,GotoIf($["${OPENCALLER_1001_CONTACTS}"=""]?unavailable)
 same => n,Dial(${OPENCALLER_1001_CONTACTS},${OPENCALLER_RING_SECONDS})
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?unavailable)
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?unavailable)
 same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?unavailable)
 same => n,Hangup()
 same => n(unavailable),VoiceMail(1001@opencaller,u)
 same => n,Hangup()
 same => n(busy),VoiceMail(1001@opencaller,b)
 same => n,Hangup()
 same => n(done),Hangup()

exten => 1002,1,NoOp(OpenCaller lab call to test endpoint 1002)
 same => n,Dial(PJSIP/1002,25)
 same => n,Hangup()

; Manual developer-only mailbox playback; Asterisk still requires the mailbox PIN.
exten => *98,1,VoiceMailMain(1001@opencaller)
 same => n,Hangup()

exten => _X!,1,Hangup()
