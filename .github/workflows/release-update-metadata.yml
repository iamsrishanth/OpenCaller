name: Attach update metadata

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  metadata:
    name: Build and attach app version metadata
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive Android version from stable release tag
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("Stable release tags must use vMAJOR.MINOR.PATCH, such as v0.1.0")

          major, minor, patch = (int(part) for part in match.groups())
          if minor > 999 or patch > 999:
              raise SystemExit("Minor and patch release components must each be between 0 and 999")
          version_code = major * 1_000_000 + minor * 1_000 + patch + 1
          if version_code > 2_100_000_000:
              raise SystemExit("Release tag maps to an Android versionCode outside the supported range")

          print(f"version_name={major}.{minor}.{patch}")
          print(f"version_code={version_code}")
          PY

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        run: ./gradlew --no-daemon :app:assembleRelease -PopencallerVersionName="$VERSION_NAME" -PopencallerVersionCode="$VERSION_CODE"

      - name: Read version from APK build metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path("app/build/outputs/apk/release/output-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          application_id = metadata["applicationId"]
          element = metadata["elements"][0]
          version_code = element["versionCode"]
          version_name = element["versionName"]

          expected_application_id = "io.github.iamsrishanth.opencaller"
          if application_id != expected_application_id:
              raise SystemExit(f"Unexpected application ID: {application_id}")

          update = {
              "applicationId": application_id,
              "versionCode": int(version_code),
              "versionName": str(version_name),
          }
          Path("opencaller-update.json").write_text(
              json.dumps(update, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(update, sort_keys=True))
          PY

      - name: Attach metadata to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" opencaller-update.json --repo "$GITHUB_REPOSITORY" --clobber
